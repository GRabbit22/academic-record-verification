
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Hash</title>
</head>
<body>
    <h1>Document Fingerprint Generated</h1>

    <p><strong>Filename:</strong> {{ filename }}</p>

    <p><strong>SHA-256 Hash:</strong></p>
    <textarea rows="4" cols="75" readonly>{{ file_hash }}</textarea>

    <p><a href="/">Verify another document</a></p>
</body>
</html>
