
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | AcadVerify</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-page {
            max-width: 440px;
            margin: 70px auto;
            padding: 20px;
        }
        .login-card {
            background: white;
            color: #172033;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0,0,0,.12);
        }
        .login-card label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
        }
        .login-card input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
        }
        .login-card button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .flash-message {
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            background: #f3f4f6;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4f46e5;
        }
    </style>
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <h1>Admin Login</h1>
            <p>Sign in to register academic records.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('main.admin_login') }}">
                <label for="username">Admin ID</label>
                <input id="username" name="username"
                       type="text" autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" name="password"
                       type="password"
                       autocomplete="current-password" required>

                <button type="submit">Sign In</button>
            </form>

            <a class="back-link" href="{{ url_for('main.home') }}">
                ← Back to AcadVerify
            </a>
        </section>
    </main>
</body>
</html>
